name: Build endorsed idea

# When an idea is endorsed by the community and a maintainer adds the `doing`
# label, Claude Code implements it and opens a pull request. Vercel then posts
# a preview deployment on the PR for the community to review.

on:
  issues:
    types: [labeled]

jobs:
  build:
    if: github.event.label.name == 'doing'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Comment that the build is starting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --body "🤖 This idea is endorsed and in **Doing** — Claude Code is building it now. A pull request with a preview link will appear here shortly."

      - name: Claude Code builds the feature
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 80"
          prompt: |
            You are building an endorsed community idea into the bettergoals.ai website.
            Read CLAUDE.md first and follow its guardrails strictly.

            The idea is GitHub issue #${{ github.event.issue.number }}:
            ---
            Title: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}
            ---

            Steps:
            1. Create a branch named `idea/${{ github.event.issue.number }}` from `preview`
               (already checked out).
            2. Implement the smallest lovable version of this idea in the site.
               If the idea is ambiguous, make sensible product decisions and note
               them in the PR description rather than blocking.
            3. Run `npm run build` and fix any errors before finishing.
            4. Commit, push the branch, and open a pull request **with base branch
               `preview`** (not main), titled after the idea, with a body that links
               "Closes #${{ github.event.issue.number }}" and summarises the
               decisions you made.
            5. Comment on issue #${{ github.event.issue.number }} with a link to
               the pull request.
